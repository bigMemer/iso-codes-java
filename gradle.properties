# Maven coordinates. The Central namespace is proven by owning wwwdottheinternetdotcom.com.
group=com.wwwdottheinternetdotcom
# Root Java package for generated sources.
basePackage=com.wwwdottheinternetdotcom.isocodes

# Debian iso-codes release to generate from. The published artifact version
# matches this value. Override with -PisoCodesVersion=4.20.1
isoCodesVersion=4.20.1

org.gradle.caching=true
org.gradle.configuration-cache=true

# POM metadata.
projectUrl=https://github.com/bigMemer/iso-codes-java
developerId=bigMemer
developerName=bigMemer
developerUrl=https://github.com/bigMemer
