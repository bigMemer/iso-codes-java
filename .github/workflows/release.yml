name: Release

on:
  # Weekly schedule disabled until Maven Central credentials are configured. To re-enable:
  # schedule:
  #   - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only list unpublished releases, don't publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.find.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: echo "versions=$(python3 scripts/unpublished_versions.py)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.versions != '[]' && !(github.event_name == 'workflow_dispatch' && inputs.dry-run)
    runs-on: ubuntu-latest
    strategy:
      # Publish one release at a time, oldest first, so a failure leaves a clean gap to retry.
      max-parallel: 1
      fail-fast: true
      matrix:
        iso-codes: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build javadoc publishAndReleaseToMavenCentral -PisoCodesVersion=${{ matrix.iso-codes }} --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
