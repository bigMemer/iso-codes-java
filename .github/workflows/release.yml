name: Release

# Publishes the iso-codes version in iso-codes.version to Maven Central, unless it's already there.
# Manual only for now; Maven Central credentials aren't configured yet.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only report what would be published, don't publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          version=$(tr -d '[:space:]' < iso-codes.version)
          group=$(sed -n 's/^group=//p' gradle.properties)
          metadata="https://repo1.maven.org/maven2/${group//.//}/iso-codes/maven-metadata.xml"
          if curl -sf "$metadata" | grep -q "<version>$version</version>"; then
            echo "$group:iso-codes:$version is already on Maven Central."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$group:iso-codes:$version is not on Maven Central yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        if: steps.check.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: steps.check.outputs.publish == 'true'
      - if: steps.check.outputs.publish == 'true' && !inputs.dry-run
        run: ./gradlew build javadoc publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
